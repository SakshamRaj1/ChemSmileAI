name: Keep Studio Fresh & Free

on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning CLI & SDK
        run: pip install "lightning-sdk"

      - name: Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          # 1. Stop Studio to refresh the 4-hour inactivity timer
          echo "Stopping studio..."
          lightning stop studio scratch-studio-devbox --teamspace default-project || lightning stop studio scratch-studio-devbox || true
          
          sleep 20
          
          # 2. Start Studio
          echo "Starting studio..."
          lightning start studio scratch-studio-devbox --teamspace default-project || lightning start studio scratch-studio-devbox
