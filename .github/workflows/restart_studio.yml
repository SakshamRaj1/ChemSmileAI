name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs automatically every 3 hours and 30 minutes
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Authenticate and Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          export LIGHTNING_USER_ID="${LIGHTNING_USER_ID}"
          export LIGHTNING_API_KEY="${LIGHTNING_API_KEY}"

          python -c "
          import os, time
          from lightning_sdk import Studio

          s = Studio(name='scratch-studio-devbox', teamspace='default-project', org='Sakshamraj1')

          print('Stopping studio to reset session timer...')
          s.stop()
          time.sleep(25)

          print('Starting studio...')
          s.start()
          print('Studio successfully restarted!')
          "
