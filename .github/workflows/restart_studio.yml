# -----------------------------------New logic to restart the studio ----------------------------------

name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK & Requests
        run: pip install "lightning-sdk" requests

      - name: Health Check & Auto Cycle
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python -c "
          import os, time, requests
          from lightning_sdk import Studio

          os.environ['LIGHTNING_USER_ID'] = os.environ['LIGHTNING_USER_ID'].strip()
          os.environ['LIGHTNING_API_KEY'] = os.environ['LIGHTNING_API_KEY'].strip()

          domain = 'https://doornail-plant-jazz.ngrok-free.dev'
          s = Studio(name='scratch-studio-devbox', teamspace='default-project', org='sakshamraj1-34lrc')

          # 1. Health check external public endpoint
          is_online = False
          try:
              res = requests.get(domain, timeout=8)
              if res.status_code in [200, 302, 404]:  # If Flask responds
                  is_online = True
          except Exception:
              is_online = False

          print(f'Domain online status: {is_online}')

          # 2. If offline, restart the entire container to get a fresh 4-hour timer
          if not is_online:
              print('Domain is down! Power-cycling studio to reset master timer...')
              try:
                  s.stop()
                  time.sleep(25)
              except Exception as e:
                  print(f'Stop notice: {e}')

              print('Booting studio...')
              s.start()
              time.sleep(15)

          # 3. Ensure persistent tmux session and services are running
          print('Dispatching launch script...')
          s.run('bash /teamspace/studios/this_studio/keep_alive.sh')
          print('Watchdog cycle completed successfully.')
          "

