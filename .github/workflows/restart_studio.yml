name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs automatically every 3 hours and 30 minutes
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          # 1. Initialize Lightning CLI session directly with API key
          lightning init "${LIGHTNING_API_KEY}"

          # 2. Restart the studio
          python -c "
          import time
          from lightning_sdk import Studio

          # Target studio using the initialized session context
          s = Studio(name='scratch-studio-devbox')

          print('Stopping studio to reset session timer...')
          s.stop()
          time.sleep(25)

          print('Starting studio...')
          s.start()
          print('Studio successfully restarted and running!')
          "
