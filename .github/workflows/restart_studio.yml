# ------------------------------Improved Version (Working and restarting properly. self-healing, Zero Thread Leaks) ----------------------------------

name: Keep Studio Fresh & Free

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: studio-keep-alive
  cancel-in-progress: true

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK & Requests
        run: pip install "lightning-sdk" requests

      - name: Persistent Watchdog Loop (3.5 Hours Clean Guard)
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import os, time, requests
          from lightning_sdk import Studio

          os.environ['LIGHTNING_USER_ID'] = os.environ['LIGHTNING_USER_ID'].strip()
          os.environ['LIGHTNING_API_KEY'] = os.environ['LIGHTNING_API_KEY'].strip()

          domain = 'https://doornail-plant-jazz.ngrok-free.dev'

          for i in range(52):
              print(f'=== Check {i+1}/52 at {time.strftime(\"%H:%M:%S\")} ===')

              # 1. Health check external public endpoint
              is_healthy = False
              try:
                  res = requests.get(domain, timeout=8)
                  if res.status_code in [200, 302] and 'ERR_NGROK' not in res.text:
                      is_healthy = True
              except Exception:
                  is_healthy = False

              print(f'Domain healthy: {is_healthy}')

              # 2. Recover only if unhealthy (fresh Studio client created on-demand)
              if not is_healthy:
                  print('Site unhealthy or stopped. Restoring services...')
                  try:
                      s = Studio(name='scratch-studio-devbox', teamspace='default-project', org='sakshamraj1-34lrc')
                      try:
                          s.stop()
                          time.sleep(15)
                      except Exception:
                          pass

                      s.start()
                      print('Waiting 45s for boot...')
                      time.sleep(45)

                      print('Deploying services...')
                      s.run('bash /teamspace/studios/this_studio/keep_alive.sh')
                      print('Services online!')
                  except Exception as err:
                      print(f'Recovery notice: {err}')
              else:
                  print('All systems operational.')

              print('Sleeping 240s (4m)...')
              time.sleep(240)

          # 3. Successor trigger
          print('Runner lifecycle complete. Triggering successor...')
          try:
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('REPO')
              url = f'https://api.github.com/repos/{repo}/actions/workflows/restart_studio.yml/dispatches'
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github.v3+json'
              }
              resp = requests.post(url, headers=headers, json={'ref': 'main'}, timeout=10)
              print(f'Trigger response: {resp.status_code}')
          except Exception as chain_err:
              print(f'Successor trigger note: {chain_err}')
          "
