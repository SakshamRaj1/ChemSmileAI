name: Keep Studio Fresh & Free

on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install "lightning-sdk"

      - name: Restart Studio and Keep Online
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          echo "1. Stopping studio to refresh timer..."
          lightning stop studio --name scratch-studio-devbox --teamspace default-project || lightning stop studio --name scratch-studio-devbox || true
          
          sleep 25
          
          echo "2. Starting studio..."
          lightning start studio --name scratch-studio-devbox --teamspace default-project || lightning start studio --name scratch-studio-devbox
