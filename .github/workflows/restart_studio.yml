name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs automatically every 3 hours and 30 minutes
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Authenticate and Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python -c "
          import os, time
          from lightning_sdk.lightning_cloud.login import Auth
          from lightning_sdk import Studio

          user_id = os.environ['LIGHTNING_USER_ID'].strip()
          api_key = os.environ['LIGHTNING_API_KEY'].strip()

          # 1. Programmatically authenticate and save local config
          Auth().authenticate(user_id=user_id, api_key=api_key)
          print('Successfully authenticated with Lightning Cloud!')

          # 2. Target Studio and restart
          s = Studio(name='scratch-studio-devbox', teamspace='default-project', org='Sakshamraj1')

          print('Stopping studio to reset session timer...')
          s.stop()
          time.sleep(25)

          print('Starting studio...')
          s.start()
          print('Studio successfully restarted!')
          "
