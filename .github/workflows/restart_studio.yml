name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs automatically every 3 hours and 30 minutes
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Authenticate and Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          export LIGHTNING_USER_ID="${LIGHTNING_USER_ID}"
          export LIGHTNING_API_KEY="${LIGHTNING_API_KEY}"

          python -c "
          import time
          from lightning_sdk import Studio
          from lightning_sdk.lightning_cloud.rest_client import LightningClient

          client = LightningClient()
          user_resp = client.auth_service_get_authenticated_user()
          print(f'Authenticated as user: {user_resp.username} (ID: {user_resp.id})')

          # Initialize using the exact authenticated user context
          s = Studio(
              name='scratch-studio-devbox',
              teamspace='default-project',
              user=user_resp.username
          )

          print('Stopping studio to reset session timer...')
          s.stop()
          time.sleep(25)

          print('Starting studio...')
          s.start()
          print('Studio successfully restarted and running!')
          "
