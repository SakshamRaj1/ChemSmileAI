# ----------------------------- New logic to restart every 10 minutes -----------------------------------------

name: Keep Studio Fresh & Free

on:
  schedule:
    # Run every 10 minutes to prevent the 15-minute idle auto-sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install "lightning-sdk"

      - name: Keep Studio Active
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python -c "
          import os, time
          from lightning_sdk import Studio

          os.environ['LIGHTNING_USER_ID'] = os.environ['LIGHTNING_USER_ID'].strip()
          os.environ['LIGHTNING_API_KEY'] = os.environ['LIGHTNING_API_KEY'].strip()

          s = Studio(
              name='scratch-studio-devbox',
              teamspace='default-project',
              org='sakshamraj1-34lrc'
          )

          # If studio stopped, start it
          s.start()

          # Run the persistent tmux session launcher
          print('Ensuring services are active in tmux...')
          s.run('bash /teamspace/studios/this_studio/keep_alive.sh')
          print('Services verified active!')
          "


