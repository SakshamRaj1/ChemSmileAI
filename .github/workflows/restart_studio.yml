name: Keep Studio Fresh & Free

on:
  schedule:
    # Runs automatically every 3 hours and 30 minutes
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK
        run: pip install lightning-sdk

      - name: Restart Studio
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          python -c "
          import os, time
          from lightning_sdk.lightning_cloud.login import Auth
          from lightning_sdk.lightning_cloud.rest_client import LightningClient
          from lightning_sdk import Studio

          # 1. Set environment auth
          os.environ['LIGHTNING_USER_ID'] = os.environ['LIGHTNING_USER_ID'].strip()
          os.environ['LIGHTNING_API_KEY'] = os.environ['LIGHTNING_API_KEY'].strip()

          client = LightningClient()
          
          # 2. Get the authenticated user identity dynamically
          user_data = client.projects_service_list_memberships()
          memberships = user_data.memberships if hasattr(user_data, 'memberships') else []
          
          print(f'Found {len(memberships)} project membership(s).')
          
          # 3. Locate the studio directly across projects
          studio_found = None
          for m in memberships:
              project_id = m.project_id
              cloudspaces = client.cloud_space_service_list_cloud_spaces(project_id=project_id)
              for cs in cloudspaces.cloudspaces:
                  if cs.name == 'scratch-studio-devbox':
                      print(f'Found studio scratch-studio-devbox (ID: {cs.id}) in project {project_id}')
                      studio_found = (project_id, cs.id)
                      break
              if studio_found:
                  break

          if studio_found:
              proj_id, cs_id = studio_found
              print('Stopping studio to reset session timer...')
              try:
                  client.cloud_space_service_stop_cloud_space(project_id=proj_id, id=cs_id)
              except Exception as e:
                  print(f'Stop signal returned: {e}')

              time.sleep(25)

              print('Starting studio...')
              client.cloud_space_service_start_cloud_space(project_id=proj_id, id=cs_id)
              print('Studio successfully restarted and running!')
          else:
              # Fallback to standard Studio object
              s = Studio('scratch-studio-devbox')
              s.stop()
              time.sleep(25)
              s.start()
              print('Studio restart succeeded via fallback!')
          "
