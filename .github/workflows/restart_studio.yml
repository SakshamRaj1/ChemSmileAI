# Updated code to tackle the current problem to avoid shutdown and stay 24*7 active
# it will accept the API Key only if it is available on disk, so that it can restart
# It uses better logic credential in json format for lightning login
# Instead of merely pinging the Ngrok URL externally, run a lightweight command via s.run() or send a keep-alive 
# pulse so Lightning registers actual user activity and resets the 10-minute idle countdown 

name: Keep Studio Fresh & Free

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: studio-keep-alive
  cancel-in-progress: true

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightning SDK & Requests
        run: pip install "lightning-sdk" requests

      - name: Configure Lightning Authentication
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          mkdir -p ~/.lightning
          python -c "
          import os, json
          uid = os.environ.get('LIGHTNING_USER_ID', '').strip()
          key = os.environ.get('LIGHTNING_API_KEY', '').strip()
          
          # Exact config structure expected by lightning-sdk / lightning_cloud
          creds = {
              'user_id': uid,
              'api_key': key
          }
          path = os.path.expanduser('~/.lightning/credentials.json')
          with open(path, 'w') as f:
              json.dump(creds, f)
          os.chmod(path, 0o600)
          print('Successfully written credentials.json')
          "

      - name: Persistent Watchdog & Keep-Alive Loop
        env:
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python -u -c "
          import os, time, requests, socket
          socket.setdefaulttimeout(15)

          uid = os.environ.get('LIGHTNING_USER_ID', '').strip()
          key = os.environ.get('LIGHTNING_API_KEY', '').strip()
          os.environ['LIGHTNING_USER_ID'] = uid
          os.environ['LIGHTNING_API_KEY'] = key

          domain = 'https://doornail-plant-jazz.ngrok-free.dev'
          studio_name = 'scratch-studio-devbox'
          teamspace = 'default-project'
          org = 'sakshamraj1-34lrc'

          from lightning_sdk import Studio

          for i in range(70):
              print(f'=== Check {i+1}/70 at {time.strftime(\"%H:%M:%S\")} ===', flush=True)

              # 1. External HTTP Health Check
              is_healthy = False
              try:
                  res = requests.get(domain, timeout=8)
                  if res.status_code in [200, 302] and 'ERR_NGROK' not in res.text:
                      is_healthy = True
              except Exception as net_err:
                  print(f'Ping failed: {net_err}', flush=True)

              print(f'Domain healthy: {is_healthy}', flush=True)

              # 2. Prevent 10m idle sleep OR Recover if down
              try:
                  s = Studio(name=studio_name, teamspace=teamspace, org=org)
                  
                  if is_healthy:
                      # Reset the 10-minute idle sleep timer by executing an active host touch
                      print('Sending heartbeat to studio host to reset 10m idle timer...', flush=True)
                      try:
                          s.run('touch /tmp/keepalive_pulse')
                          print('Studio heartbeat pulse recorded.', flush=True)
                      except Exception as hb_err:
                          print(f'Heartbeat pulse notice: {hb_err}', flush=True)
                  else:
                      # Machine went offline; initiate full reboot sequence
                      print('Site is offline. Waking Studio container...', flush=True)
                      try:
                          s.start()
                          print('Start command sent. Waiting 45s for container boot...', flush=True)
                          time.sleep(45)
                      except Exception as start_err:
                          print(f'Start notice: {start_err}', flush=True)

                      print('Deploying application services...', flush=True)
                      s.run('bash /teamspace/studios/this_studio/keep_alive.sh')
                      print('Services triggered successfully!', flush=True)

              except Exception as studio_err:
                  print(f'Studio communication notice: {studio_err}', flush=True)

              print('Sleeping 180s (3m)...', flush=True)
              time.sleep(180)

          # 3. Successor Handoff Trigger
          print('Runner loop complete. Triggering successor...', flush=True)
          try:
              token = os.environ.get('GH_TOKEN')
              repo = os.environ.get('REPO')
              url = f'https://api.github.com/repos/{repo}/actions/workflows/restart_studio.yml/dispatches'
              headers = {
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github.v3+json'
              }
              resp = requests.post(url, headers=headers, json={'ref': 'main'}, timeout=10)
              print(f'Successor response: {resp.status_code}', flush=True)
          except Exception as chain_err:
              print(f'Successor trigger note: {chain_err}', flush=True)
          "


